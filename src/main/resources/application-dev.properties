spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:orcl}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

app.jwtSecret=${JWT_SECRET:qualquercoisaaquiparatestekkkk1234567890}

server.port=8080

# Logs detalhados só em desenvolvimento (em prod eles expõem dados dos parâmetros SQL)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.br.com.chupinvet=DEBUG
logging.level.org.springdoc=DEBUG