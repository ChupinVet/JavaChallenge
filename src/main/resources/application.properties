spring.application.name=chupinvet

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.br.com.chupinvet=DEBUG
logging.level.org.springdoc=DEBUG

spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

spring.jackson.default-property-inclusion=non_null
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

springdoc.info.title=Api para cadastro de Veterinários, Responsáveis e Pets
springdoc.info.description=Documentação da API ChupinVet
springdoc.info.version=v1.0.0

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.try-it-out-enabled=true

# Schema é gerenciado manualmente (Estrutura_e_Carga.sql), compartilhado
# com a API .NET, e Flyway está fora de escopo nesta sprint — o Hibernate
# NUNCA deve alterar o schema sozinho. "validate" só confere se as
# entidades batem com as tabelas reais; se não bater, falha ao subir
# (é isso que queremos: falhar cedo, não corromper uma tabela compartilhada).
spring.jpa.hibernate.ddl-auto=validate

# Expiração do token: 1 hora. O valor do segredo (app.jwtSecret) é
# definido por perfil (dev tem um valor fixo de desenvolvimento; prod
# vem de variável de ambiente) — nunca hardcoded aqui no arquivo comum.
app.jwtExpirationMs=3600000