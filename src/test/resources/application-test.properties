# Perfil usado só pelos testes automatizados (@ActiveProfiles("test")).
# Banco H2 em memória: as tabelas são criadas a partir das entidades no início e apagadas no fim (cada contexto de teste tem o seu banco), então os testes não dependem do Oracle nem do MySQL.
spring.datasource.url=jdbc:h2:mem:chupinvet-${random.uuid}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Chave do JWT gerada aleatoriamente a cada execução: nenhuma chave fica no repositório.
app.jwtSecret=${random.uuid}${random.uuid}
app.jwtExpirationMs=3600000